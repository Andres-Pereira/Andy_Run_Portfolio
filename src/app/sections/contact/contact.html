@let t = i18n.t();
<section id="contact" aria-labelledby="contact-title">
  <div class="bg" aria-hidden="true"><ar-texture variant="ember-rise" /></div>

  <div class="wrap">
    <div class="intro">
      <h2 id="contact-title">{{ t.kTitle }}</h2>
      <p>{{ t.kIntro }}</p>
      <div>
        <a
          arButton
          variant="glass"
          size="lg"
          [href]="links.calendar"
          target="_blank"
          rel="noopener noreferrer"
          arrow
        >
          {{ t.book }}
        </a>
      </div>
      <ul class="reach">
        <li>
          <a [href]="'mailto:' + links.email">
            <span class="k">Email · Sample</span><span class="v">{{ links.email }}</span>
          </a>
        </li>
        <li>
          <a [href]="links.linkedin" target="_blank" rel="noopener noreferrer">
            <span class="k">LinkedIn</span><span class="v">{{ links.linkedinHandle }} →</span>
          </a>
        </li>
      </ul>
    </div>

    <div class="panel">
      @if (!sent()) {
        <!-- (input) burbujea desde cualquier campo: escribir borra el error -->
        <form novalidate (submit)="submit($event)" (input)="error.set(null)">
          <label>
            <span class="k">{{ t.fName }}</span>
            <input
              #nameInput
              [formField]="contactForm.name"
              autocomplete="name"
              [placeholder]="t.phName"
            />
          </label>
          <label>
            <span class="k">Email</span>
            <input
              type="email"
              [formField]="contactForm.email"
              autocomplete="email"
              [placeholder]="t.phEmail"
            />
          </label>
          <label>
            <span class="k">{{ t.fMsg }}</span>
            <textarea [formField]="contactForm.message" rows="5" [placeholder]="t.phMsg"></textarea>
          </label>

          @if (error(); as key) {
            <p class="error" role="alert">{{ t[key] }}</p>
          }

          <button type="submit" class="send">{{ t.send }}<span aria-hidden="true">→</span></button>
          <span class="hint">{{ t.inbox }}</span>
        </form>
      } @else {
        <div class="thanks">
          <ar-isotype [size]="64" [running]="true" />
          <h3 #thanksTitle tabindex="-1">{{ thanks() }}</h3>
          <p>{{ t.thanksSub }}</p>
          <button type="button" class="again" (click)="reset()">{{ t.another }}</button>
        </div>
      }
    </div>
  </div>
</section>
